name: Build vdpm release bundles

on:
  pull_request:
    paths:
      - .gitattributes
      - CMakeLists.txt
      - THIRD_PARTY_NOTICES.md
      - cmake/**
      - include/**
      - patches/pacman/**
      - scripts/**
      - src/**
      - bootstrap-vitasdk.ps1
      - tests/pacman/**
      - bootstrap-vitasdk.sh
      - tests/test-bootstrap-powershell.sh
      - tests/test-channels-powershell.sh
      - tests/test-channel-names.sh
      - tests/test-bootstrap-root-install.sh
      - tests/test-bootstrap-seed.sh
      - tests/test-bootstrap-windows.ps1
      - tests/test-host-triplet.sh
      - tests/test-release-bundle.sh
      - .github/workflows/release.yml
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            [[ $version =~ ^[A-Za-z0-9][A-Za-z0-9.+-]*$ ]]
          else
            version="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  # glibc hosts build inside Ubuntu 20.04, musl hosts inside Alpine, to cap the libc version they need.
  build-linux-container:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x86_64-linux-gnu
            runner: ubuntu-24.04
            image: ubuntu:20.04
          - host: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            image: ubuntu:20.04
          - host: x86_64-linux-musl
            runner: ubuntu-24.04
            image: alpine:3.20
          - host: aarch64-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.20
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Exercise the host triplet contract
        if: matrix.host == 'x86_64-linux-gnu'
        shell: bash
        run: ./tests/test-host-triplet.sh
      - name: Exercise the Windows installer under PowerShell
        if: matrix.host == 'x86_64-linux-gnu'
        shell: bash
        run: ./tests/test-bootstrap-powershell.sh
      - name: Exercise the Windows channel listing under PowerShell
        if: matrix.host == 'x86_64-linux-gnu'
        shell: bash
        run: ./tests/test-channels-powershell.sh
      - name: Check which series names a refresh accepts
        if: matrix.host == 'x86_64-linux-gnu'
        shell: bash
        run: ./tests/test-channel-names.sh
      - name: Install into a top-level directory
        if: matrix.host == 'x86_64-linux-gnu'
        shell: bash
        run: ./tests/test-bootstrap-root-install.sh
      - name: Check the seed release carries what the installers require
        if: matrix.host == 'x86_64-linux-gnu'
        shell: bash
        run: ./tests/test-bootstrap-seed.sh
      - uses: actions/cache@v6
        with:
          path: downloads
          key: vdpm-downloads-${{ hashFiles('cmake/PackageClientVersions.cmake') }}
      - name: Build, bundle and validate inside ${{ matrix.image }}
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          VDPM_HOST: ${{ matrix.host }}
          VDPM_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release downloads
          docker run --rm \
            -v "$PWD":/src:ro \
            -v "$PWD/release":/release \
            -v "$PWD/downloads":/downloads \
            -e SOURCE_DATE_EPOCH -e VDPM_HOST -e VDPM_VERSION \
            -e VDPM_REVISION='${{ github.sha }}' \
            -e VDPM_DOWNLOAD_DIR=/downloads \
            '${{ matrix.image }}' /src/scripts/build-in-linux-container.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vdpm-${{ matrix.host }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: arm64-apple-darwin
            runner: macos-15
          - host: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install macOS build dependencies
        run: |
          # The runner image ships an untrusted tap that every brew call warns about.
          brew untap aws/tap 2>/dev/null || true
          brew install bash meson ninja pkg-config
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: downloads
          key: vdpm-downloads-${{ hashFiles('cmake/PackageClientVersions.cmake') }}
      - name: Build, bundle and validate
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          VDPM_HOST: ${{ matrix.host }}
          VDPM_VERSION: ${{ needs.prepare.outputs.version }}
          VDPM_REVISION: ${{ github.sha }}
          VDPM_DOWNLOAD_DIR: ${{ github.workspace }}/downloads
        run: scripts/build-and-bundle.sh . "$PWD"
      - uses: actions/upload-artifact@v7
        with:
          name: vdpm-${{ matrix.host }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # No hosted FreeBSD runner exists; cross-compiles from Linux instead.
  build-freebsd:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x86_64-unknown-freebsd
            runner: ubuntu-24.04
            arch: x86_64
            freebsd_arch_dir: amd64/amd64
          - host: aarch64-unknown-freebsd
            runner: ubuntu-24.04-arm
            arch: aarch64
            freebsd_arch_dir: arm64/aarch64
    runs-on: ${{ matrix.runner }}
    env:
      FREEBSD_RELEASE: 14.3-RELEASE
    steps:
      - uses: actions/checkout@v7
      - name: Install cross build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake meson ninja-build pkg-config clang lld llvm
      - name: Cache the FreeBSD sysroot
        id: sysroot-cache
        uses: actions/cache@v6
        with:
          path: freebsd-sysroot
          key: freebsd-sysroot-${{ matrix.host }}-${{ env.FREEBSD_RELEASE }}
      - name: Fetch FreeBSD base for the sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error -o base.txz \
            "https://download.freebsd.org/releases/${{ matrix.freebsd_arch_dir }}/$FREEBSD_RELEASE/base.txz"
          mkdir -p freebsd-sysroot
          # Only headers and libraries; the rest of base.txz goes unused.
          tar -xJf base.txz -C freebsd-sysroot ./usr/include ./usr/lib ./lib
          rm base.txz
          # The clang resource tree and unreferenced static archives never join the link.
          rm -rf freebsd-sysroot/usr/lib/clang
          find freebsd-sysroot/usr/lib -maxdepth 1 -name '*.a' \
            ! -name 'libgcc*' ! -name 'libcompiler_rt*' ! -name '*_nonshared*' -delete
          # Some .so files are linker scripts; every archive they name must survive.
          for script in freebsd-sysroot/usr/lib/*.so; do
            [ -L "$script" ] && continue
            head -c 4 "$script" | grep -q ELF && continue
            for ref in $(grep -oE '/[^ )]+\.a' "$script"); do
              test -e "freebsd-sysroot$ref"
            done
          done
      - uses: actions/cache@v6
        with:
          path: downloads
          key: vdpm-downloads-${{ hashFiles('cmake/PackageClientVersions.cmake') }}
      - name: Build, bundle and validate
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          VDPM_HOST: ${{ matrix.host }}
          VDPM_VERSION: ${{ needs.prepare.outputs.version }}
          VDPM_REVISION: ${{ github.sha }}
          VDPM_DOWNLOAD_DIR: ${{ github.workspace }}/downloads
          VDPM_FREEBSD_SYSROOT: ${{ github.workspace }}/freebsd-sysroot
          VDPM_TOOLCHAIN: cmake/toolchains/freebsd.cmake
          # The binaries run afterwards, in the smoke-freebsd VM job.
          VDPM_VALIDATE_EXECUTABLES: '0'
        run: |
          export VDPM_FREEBSD_TARGET="${{ matrix.arch }}-unknown-freebsd${FREEBSD_RELEASE%-RELEASE}"
          scripts/build-and-bundle.sh . "$PWD"
      - uses: actions/upload-artifact@v7
        with:
          name: vdpm-${{ matrix.host }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  smoke-freebsd:
    needs: [prepare, build-freebsd]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vdpm-x86_64-unknown-freebsd
          path: release
      - name: Start the FreeBSD VM
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963 # v1.4.0
        with:
          operating_system: freebsd
          version: '14.3'
          architecture: x86-64
      - name: Execute the bundle on real FreeBSD
        shell: cpa.sh {0}
        run: |
          sudo env ASSUME_ALWAYS_YES=YES pkg install -y bash
          mkdir extracted
          tar -xjf release/vdpm-*-x86_64-unknown-freebsd.tar.bz2 -C extracted
          root=$(dirname "$(find extracted -type f -path '*/bin/vdpm' | head -n 1)")/..
          "$root/bin/vdpm" --help
          "$root/libexec/vdpm/pacman" --version
          printf '[options]\nArchitecture = x86_64-unknown-freebsd vita\nSigLevel = Never\n[smoke]\nServer = https://vitasdk.org/channels\n' > pacman.conf
          mkdir -p db rootdir
          output=$("$root/libexec/vdpm/pacman" --config pacman.conf \
            --root "$PWD/rootdir" --dbpath "$PWD/db" -Syy 2>&1) || true
          printf '%s\n' "$output"
          case $output in
            *certificate*|*SSL*) echo 'TLS trust is broken in the shipped libcurl' >&2; exit 1 ;;
            *'failed retrieving file'*) ;;
            *) echo 'unexpected pacman output' >&2; exit 1 ;;
          esac

  build-windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            git
            gcc
            meson
            ninja
            pkgconf
            gettext-devel
            heimdal-devel
            libarchive-devel
            libcurl-devel
            libsqlite-devel
            libunistring-devel
            openssl-devel
            ca-certificates
      - name: Build patched Pacman runtime
        shell: msys2 {0}
        run: >-
          ./tests/pacman/msys-pacman-build.sh
          "$(cygpath -u "$RUNNER_TEMP")/vdpm-pacman"
      - name: Build native vdpm frontend
        shell: pwsh
        run: |
          cmake.exe -S . -B build-windows `
            -DBUILD_VDPM_CHANNEL=OFF `
            -DBUILD_VDPM_PACKAGE_CLIENT=OFF `
            -DCMAKE_INSTALL_PREFIX="$pwd/stage" `
            -A x64
          cmake.exe --build build-windows --config Release --target install
      - name: Assemble, create and validate release bundle
        shell: msys2 {0}
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          stage=$(cygpath -u "$GITHUB_WORKSPACE/stage")
          pacman_stage=$(cygpath -u "$RUNNER_TEMP/vdpm-pacman")
          # An MSYS root of its own. Put msys-2.0.dll in the SDK's own usr/bin
          # and the SDK becomes an MSYS root, whose built-in /bin -> /usr/bin
          # mount then catches every file a package installs into bin/.
          msys=$stage/share/vdpm/msys/usr
          mkdir -p "$msys/bin" "$stage/share/vdpm/licenses"
          cp "$pacman_stage/pacman.exe" "$msys/bin/"
          cp "$pacman_stage/vdpm-channel.exe" "$msys/bin/"
          cp "$pacman_stage/msys-2.0.dll" "$msys/bin/"
          cp -R "$pacman_stage/licenses/." "$stage/share/vdpm/licenses/"
          # Without these, pacman on Windows cannot open an HTTPS connection,
          # so it can verify a channel and then fail to download a single
          # package from it. The path is where the MSYS runtime looks, which
          # is relative to that root and moves with it.
          mkdir -p "$msys/ssl/certs"
          cp /usr/ssl/certs/ca-bundle.crt "$msys/ssl/certs/"
          scripts/create-release-bundle.sh \
            "$stage" "$PWD/release" x86_64-w64-mingw32 \
            '${{ needs.prepare.outputs.version }}' '${{ github.sha }}'
          VDPM_VALIDATE_PE_IMPORTS=1 scripts/validate-release-bundle.sh \
            release/*.tar.bz2 x86_64-w64-mingw32
      - name: Exercise exact Windows bundle inputs
        shell: pwsh
        run: |
          ./tests/pacman/msys-runtime-smoke.ps1 `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP "vdpm release ñ 日本語") `
            -FixtureTar (Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr/bin/bsdtar.exe') `
            -PacmanExecutable (Join-Path $env:RUNNER_TEMP 'vdpm-pacman/pacman.exe') `
            -RuntimeDll (Join-Path $env:RUNNER_TEMP 'vdpm-pacman/msys-2.0.dll') `
            -Extended
      - name: Install a real SDK with the bundle this job just built
        shell: pwsh
        env:
          VITASDK_SEED_ARCHIVE: ${{ github.workspace }}/release/vdpm-${{ needs.prepare.outputs.version }}-x86_64-w64-mingw32.tar.bz2
        run: ./tests/test-bootstrap-windows.ps1

      - name: Exercise atomic Windows bootstrap
        shell: pwsh
        run: |
          $fixtureParent = Join-Path $env:RUNNER_TEMP 'bootstrap-fixture'
          $fixture = Join-Path $fixtureParent 'vitasdk'
          Copy-Item -Recurse stage $fixture
          New-Item -ItemType Directory -Force (Join-Path $fixture 'etc') | Out-Null
          [IO.File]::WriteAllText((Join-Path $fixture 'etc/pacman.conf'), "[options]`nArchitecture = x86_64-w64-mingw32 vita`n")
          [IO.File]::WriteAllText((Join-Path $fixture 'version_info.txt'), "test`n")
          [IO.File]::WriteAllText((Join-Path $fixture 'bin/arm-vita-eabi-gcc.exe'), "bootstrap contract`n")
          $archive = Join-Path $env:RUNNER_TEMP 'vitasdk-bootstrap-test.tar.bz2'
          & tar.exe -cjf $archive -C $fixtureParent vitasdk
          if ($LASTEXITCODE -ne 0) { throw 'could not create bootstrap fixture' }
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash
          ./bootstrap-vitasdk.ps1 `
            -ArchivePath $archive `
            -Sha256 $digest `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'installed-vitasdk')
      - name: Exercise signed Windows channel refresh
        shell: pwsh
        run: |
          ./tests/test-channel-refresh-windows.ps1 `
            -ProductRoot (Join-Path $pwd 'stage') `
            -OpenSslExecutable (Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr/bin/openssl.exe')
      - uses: actions/upload-artifact@v7
        with:
          name: vdpm-x86_64-w64-mingw32
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # The Windows installer has been run for real against the published channels
  # for a while; the shell one never was. Every smoke test hands it a local
  # archive, which is the one path that skips the seed and the channel index,
  # so a seed the installer could not accept shipped and broke every install.
  smoke-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install from the published channels, as a new user would
        shell: bash
        run: |
          docker run --rm -v "$PWD":/src:ro ubuntu:24.04 bash -euc '
            apt-get update -qq >/dev/null
            apt-get install -y -qq curl ca-certificates bzip2 tar >/dev/null
            /src/bootstrap-vitasdk.sh
            /usr/local/vitasdk/bin/vdpm --help >/dev/null
            /usr/local/vitasdk/libexec/vdpm/pacman --version >/dev/null
            /usr/local/vitasdk/bin/arm-vita-eabi-gcc --version
            printf "int main(){return 0;}\n" > /tmp/probe.c
            /usr/local/vitasdk/bin/arm-vita-eabi-gcc -c /tmp/probe.c -o /tmp/probe.o
          '

  collect:
    needs: [prepare, build-linux-container, build-macos, build-freebsd, smoke-freebsd, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: vdpm-*
          path: release
          merge-multiple: true
      # A release seeds from itself. The pin in the tree is what somebody
      # running the installer out of a git checkout gets, so it names the
      # newest published release and is a real answer; what goes out with a
      # release names that release, because the seeds are in it. Nothing is
      # left to remember: the pin used to be a constant somebody had to bump,
      # and it sat three releases behind until a musl host tripped over it.
      #
      # Safe because the release below is a transaction: created as a draft,
      # every asset uploaded, downloaded back and compared, and only then
      # published. Nobody can fetch the installer before its seeds exist.
      - name: Seed this release from itself
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag=$GITHUB_REF_NAME
          sed -i "s/^SEED_RELEASE=.*/SEED_RELEASE=$tag/; s/^SEED_VERSION=.*/SEED_VERSION=$VERSION/" \
            bootstrap-vitasdk.sh
          sed -i "s/^\$SeedRelease = .*/\$SeedRelease = '$tag'/; s/^\$SeedVersion = .*/\$SeedVersion = '$VERSION'/" \
            bootstrap-vitasdk.ps1
          grep -H '^SEED_RELEASE=\|^SEED_VERSION=' bootstrap-vitasdk.sh
          grep -H 'SeedRelease\|SeedVersion' bootstrap-vitasdk.ps1

      - name: Verify complete release set
        shell: bash
        run: |
          cp bootstrap-vitasdk.sh bootstrap-vitasdk.ps1 release/
          expected=(
            x86_64-linux-gnu
            aarch64-linux-gnu
            x86_64-linux-musl
            aarch64-linux-musl
            arm64-apple-darwin
            x86_64-apple-darwin
            x86_64-unknown-freebsd
            aarch64-unknown-freebsd
            x86_64-w64-mingw32
          )
          for host in "${expected[@]}"; do
            archive="release/vdpm-${{ needs.prepare.outputs.version }}-$host.tar.bz2"
            test -f "$archive"
            if [[ $host == *-w64-mingw32 ]]; then
              VDPM_VALIDATE_PE_IMPORTS=1 \
                scripts/validate-release-bundle.sh "$archive" "$host"
            else
              scripts/validate-release-bundle.sh "$archive" "$host"
            fi
            (cd release && sha256sum -c "$(basename "$archive").sha256")
          done
          (
            cd release
            sha256sum -- *.tar.bz2 bootstrap-vitasdk.sh bootstrap-vitasdk.ps1 |
              LC_ALL=C sort -k2 > SHA256SUMS
          )
      - uses: actions/upload-artifact@v7
        with:
          name: vdpm-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, collect]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vdpm-release
          path: release
      - name: Publish immutable component release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$GITHUB_REF_NAME
          release_kind=()
          if [[ ${tag#v} == *-* ]]; then
            release_kind+=(--prerelease)
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft "${release_kind[@]}" --target "$GITHUB_SHA" --title "$tag" \
            --notes "Verified vdpm package-manager bundles for $tag."
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" release/*
          mkdir downloaded-release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir downloaded-release
          diff -ru release downloaded-release
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
