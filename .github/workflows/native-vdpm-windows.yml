name: Native vdpm Windows smoke

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - src/CMakeLists.txt
      - src/vdpm.c
      - tests/test-vdpm-windows.ps1
      - .github/workflows/native-vdpm-windows.yml
  push:
    branches:
      - master
      - next
    paths:
      - CMakeLists.txt
      - src/CMakeLists.txt
      - src/vdpm.c
      - tests/test-vdpm-windows.ps1
      - .github/workflows/native-vdpm-windows.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise native vdpm over minimal MSYS pacman
        shell: pwsh
        run: ./tests/test-vdpm-windows.ps1
